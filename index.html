<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Умное кольцо · Башня Останкино</title>
<style>
@font-face{font-family:"SB Sans Display";src:url(f/sbd-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"SB Sans Text";src:url(f/sbt-400.woff2) format("woff2");font-weight:400;font-display:swap}
:root{--bg:#0a0b0a;--panel:#121412;--fg:#eef0ec;--mut:#8b9189;--line:#262b25;--acc:#B2FF66;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 "SB Sans Text",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1500px;margin:0 auto;padding:24px 16px 56px}
h1{font:600 clamp(22px,3vw,32px)/1.15 "SB Sans Display",system-ui,sans-serif;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 22px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 22px}
h2{font:600 20px/1.2 "SB Sans Display",system-ui,sans-serif;margin:0 0 10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
h2 small{font:400 14px "SB Sans Text",system-ui,sans-serif;color:var(--mut)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button,.ctl button{font:inherit;color:var(--fg);background:#1a1d1a;border:0;padding:8px 14px;cursor:pointer;min-height:38px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--acc);color:#0b0c0b;font-weight:600}
.ctl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ctl button{border:1px solid var(--line);border-radius:8px}
.ctl button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc)}
.stage{background:#000;border-radius:8px;overflow:hidden;display:flex;justify-content:center;align-items:center}
.stage video{display:block;max-width:100%;max-height:78vh;width:auto;height:auto;background:#000}
.stage.wide{overflow-x:auto;justify-content:flex-start}
.stage.wide video{max-height:none;width:100%;min-width:900px}
.meta{color:var(--mut);font-size:13px;margin:8px 0 0}
.t{font-variant-numeric:tabular-nums;color:var(--mut);font-size:13px;margin-left:auto;align-self:center}
</style></head><body><main>
<h1>Умное кольцо · Башня Останкино</h1>
<p class="sub">Версия 13.6 (тест) · 30 с · видео без звука, закольцовано.</p>

<section data-player="bashnya">
<h2>Башня Останкино <small>532×880 · 30 к/с · версия 13.6 · тест</small></h2>
<div class="bar">
  <div class="seg" data-k="view"><button data-v="zdanie" aria-pressed="true">На здании</button><button data-v="plosko">Плоско</button></div>
</div>
<div class="stage"><video playsinline muted loop autoplay preload="auto" controls></video></div>
<div class="ctl"></div>
<p class="meta">Плоско — файл для экрана: верх 432×450, низ 532×430; в начале плавно из чёрного, в конце в чёрный. На здании — вид башни с улицы.</p>
</section>

</main>
<script>
const V='?v=13_6';
const SRC={
 bashnya:s=>s.view==='zdanie'?'v/bashnya_ulica.mp4':'v/bashnya.mp4',
 };
document.querySelectorAll('[data-player]').forEach(sec=>{
  const id=sec.dataset.player, v=sec.querySelector('video:not([data-flat])'), fl=sec.querySelector('video[data-flat]'), stage=sec.querySelector('.stage'), ctl=sec.querySelector('.ctl');
  const st={}; sec.querySelectorAll('.seg').forEach(g=>{st[g.dataset.k]=g.querySelector('[aria-pressed="true"]').dataset.v;
    g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));st[g.dataset.k]=b.dataset.v;load(true);});});
  function load(keep){const t=keep?v.currentTime:0, r=v.playbackRate, p=!v.paused||!keep;
    v.src=SRC[id](st)+V; v.load(); v.addEventListener('loadedmetadata',()=>{try{v.currentTime=Math.min(t,v.duration-0.05)}catch(e){} v.playbackRate=r; if(p)v.play().catch(()=>{});},{once:true});}
  const F=1/30, btn=(txt,fn,title)=>{const b=document.createElement('button');b.textContent=txt;b.title=title||txt;b.onclick=fn;ctl.appendChild(b);return b;};
  btn('⏯ Пауза',()=>{v.paused?v.play():v.pause()},'Пуск / пауза (пробел)');
  btn('◀ кадр',()=>{v.pause();v.currentTime=Math.max(0,v.currentTime-F)},'Кадр назад');
  btn('кадр ▶',()=>{v.pause();v.currentTime=Math.min(v.duration,v.currentTime+F)},'Кадр вперёд');
  const sl=btn('0,5×',()=>{v.playbackRate=v.playbackRate===1?0.5:1;sl.setAttribute('aria-pressed',v.playbackRate!==1)},'Скорость 0,5×');
  btn('⛶ Во весь экран',()=>{(stage.requestFullscreen||stage.webkitRequestFullscreen||v.webkitEnterFullscreen).call(stage.requestFullscreen?stage:v)},'Полный экран');
  const tm=document.createElement('span');tm.className='t';ctl.appendChild(tm);
  v.addEventListener('timeupdate',()=>{tm.textContent=v.currentTime.toFixed(2)+' / '+(v.duration||0).toFixed(2)+' с · кадр '+Math.round(v.currentTime*30)});
  load(false);
});
document.addEventListener('keydown',e=>{const v=[...document.querySelectorAll('video')].find(x=>{const r=x.getBoundingClientRect();return r.top<innerHeight&&r.bottom>0});if(!v)return;
  if(e.key===' '){e.preventDefault();v.paused?v.play():v.pause()} if(e.key==='ArrowRight'){v.pause();v.currentTime+=1/30} if(e.key==='ArrowLeft'){v.pause();v.currentTime-=1/30}});
</script>
</body></html>
